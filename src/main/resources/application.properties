spring.application.name=payment
server.port=8080

# Registered payment methods — add new class names here without touching Java code (OCP)
payment.methods=payment.methods.CreditCardPayment,payment.methods.PayPalPayment,payment.methods.BankTransferPayment

# PostgreSQL
spring.datasource.url=jdbc:postgresql://db:5432/paymentdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
